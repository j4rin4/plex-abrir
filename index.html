<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abrir en Plex</title>
<style>
  :root { --bg: #f4f4f5; --fg: #18181b; --muted: #52525b; --accent: #e5a00d; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --card: #27272a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { background: var(--card); margin: 16px; padding: 28px 24px; border-radius: 16px; max-width: 360px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { display: block; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; margin-top: 10px; }
  .app { background: var(--accent); color: #18181b; }
  .web { border: 1px solid var(--muted); color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>▶️ Abriendo Plex…</h1>
  <p id="estado">Si no se abre la app, usa los botones.</p>
  <a class="app" id="app" href="#">Reproducir en la app</a>
  <a class="web" id="web" href="#">Abrir en el navegador</a>
</main>
<script>
  // Parámetros: s = identificador del servidor Plex (40 hex), k = ratingKey del elemento a reproducir,
  // t = metadataType opcional (1 película, 4 episodio), prueba = muestra variantes sin abrir nada solo
  const q = new URLSearchParams(location.search);
  const s = q.get("s") || "", k = q.get("k") || "", t = q.get("t") || "";
  const valido = /^[0-9a-f]{40}$/i.test(s) && /^\d+$/.test(k) && /^\d*$/.test(t);
  const estado = document.getElementById("estado");
  if (!valido) {
    estado.textContent = "Enlace incompleto.";
    document.getElementById("app").remove();
    document.getElementById("web").remove();
  } else if (q.has("prueba")) {
    const clave = encodeURIComponent("/library/metadata/" + k);
    const variantes = [
      ["A · play", "plex://play/?metadataKey=" + clave + "&server=" + s],
      ["B · play + tipo", "plex://play/?metadataKey=" + clave + "&metadataType=" + (t || 1) + "&server=" + s],
      ["C · preplay (ficha en mi servidor)", "plex://preplay/?metadataKey=" + clave + "&metadataType=" + (t || 1) + "&server=" + s],
      ["D · plexapp play", "plexapp://play/?metadataKey=" + clave + "&metadataType=" + (t || 1) + "&server=" + s],
    ];
    document.querySelector("h1").textContent = "🧪 Pruebas de enlace";
    estado.textContent = "Con Plex ya abierto en segundo plano, toca cada opción y apunta qué hace.";
    document.getElementById("app").remove();
    document.getElementById("web").remove();
    for (const [nombre, url] of variantes) {
      const a = document.createElement("a");
      a.className = "app"; a.href = url; a.textContent = nombre;
      document.querySelector("main").appendChild(a);
    }
  } else {
    const clave = encodeURIComponent("/library/metadata/" + k);
    const web = "https://app.plex.tv/desktop/#!/server/" + s + "/details?key=" + clave;
    const ruta = "play/?metadataKey=" + clave + (t ? "&metadataType=" + t : "") + "&server=" + s;
    const ua = navigator.userAgent;
    const android = /Android/i.test(ua);
    const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const app = android
      ? "intent://" + ruta + "#Intent;scheme=plex;package=com.plexapp.android;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
      : "plex://" + ruta;
    document.getElementById("app").href = app;
    document.getElementById("web").href = web;
    if (android || ios) {
      location.href = app;
      // Si la app no se abre, la página sigue visible: pasar al navegador
      setTimeout(() => { if (!document.hidden) location.href = web; }, 2500);
    } else {
      location.replace(web);
    }
  }
</script>
</body>
</html>
